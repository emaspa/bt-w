<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">bt-w</title>
  <desc id="d">Linux control for Creative BT-W5 and BT-W6 Bluetooth dongles</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0" stop-color="#0a0b0b"/>
      <stop offset="0.38" stop-color="#131110"/>
      <stop offset="0.6" stop-color="#4a1f08"/>
      <stop offset="0.8" stop-color="#b84808"/>
      <stop offset="1" stop-color="#dd6b15"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4924b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f4924b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dd6b15"/>
      <stop offset="1" stop-color="#f4924b"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fdf3e6" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="320" fill="url(#gridFade)"/></mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="-6" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="1010" cy="170" r="260" fill="url(#warm)"/>

    <!-- wordmark, drawn as strokes so it renders the same everywhere -->
    <g fill="none" stroke="#fdf3e6" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 58V176"/>
      <circle cx="132" cy="140" r="36"/>
      <path d="M212 76V152a24 24 0 0 0 24 24h8"/>
      <path d="M190 104h50"/>
      <path d="M366 104l24 72 26-66 26 66 24-72"/>
    </g>
    <rect x="276" y="132" width="62" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>

    <text x="88" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#cdbfae" letter-spacing="0.2">Linux control for Creative BT-W5 and BT-W6 Bluetooth dongles</text>

    <!-- the dongle's LED colours -->
    <g filter="url(#softGlow)">
      <circle cx="96" cy="274" r="7" fill="#3b82f6"/>
      <circle cx="126" cy="274" r="7" fill="#22c55e"/>
      <circle cx="156" cy="274" r="7" fill="#f97316"/>
      <circle cx="186" cy="274" r="7" fill="#14c8e6"/>
      <circle cx="216" cy="274" r="7" fill="#a855f7"/>
      <circle cx="246" cy="274" r="7" fill="#facc15"/>
      <circle cx="276" cy="274" r="7" fill="#fdf3e6"/>
      <circle cx="306" cy="274" r="7" fill="#e83fd0"/>
    </g>

    <!-- BT-W6: USB-C plug on top, tapered body, swoosh with the LED, USB-C port at the bottom -->
    <g transform="translate(990 168) rotate(-72) scale(0.98)">
      <g fill="none" stroke-linecap="round" stroke-width="3.5" transform="rotate(72)">
        <path d="M112.0 -22.0 L115.9 -22.9 L120.0 -23.4 L123.7 -24.9 L126.8 -28.0 L129.8 -31.7 L133.2 -34.0 L137.6 -33.4 L142.8 -30.8 L147.9 -28.7 L151.7 -30.0 L153.8 -35.7 L155.7 -42.3 L158.5 -46.3 L162.8 -46.0 L168.4 -42.5 L173.9 -39.0 L178.3 -38.7 L181.1 -42.8 L182.9 -49.4 L185.1 -55.1 L188.7 -57.0 L193.7 -54.8 L199.4 -50.8 L204.5 -48.6 L208.0 -50.5 L210.2 -56.2 L212.1 -62.8 L214.9 -66.8 L219.2 -66.6 L224.8 -63.0 L230.3 -59.5 L234.7 -59.2 L237.4 -63.3 L239.3 -69.9 L241.5 -75.6" stroke="#fdf3e6" stroke-opacity="0.9"/>
        <path d="M112.0 0.0 L116.0 0.6 L120.0 0.2 L124.0 -1.3 L128.0 -2.8 L132.0 -2.5 L136.0 0.2 L140.0 3.8 L144.0 5.5 L148.0 3.5 L152.0 -1.8 L156.0 -6.2 L160.0 -6.6 L164.0 -2.6 L168.0 3.1 L172.0 6.7 L176.0 5.9 L180.0 1.2 L184.0 -4.4 L188.0 -7.0 L192.0 -5.0 L196.0 0.3 L200.0 5.4 L204.0 6.9 L208.0 3.9 L212.0 -1.8 L216.0 -6.2 L220.0 -6.6 L224.0 -2.6 L228.0 3.1 L232.0 6.7 L236.0 5.9 L240.0 1.2 L244.0 -4.4 L248.0 -7.0 L252.0 -5.0 L256.0 0.3 L260.0 5.4 L264.0 6.9 L268.0 3.9 L272.0 -1.8 L276.0 -6.2" stroke="#fdf3e6" stroke-opacity="0.8"/>
        <path d="M112.0 22.0 L115.8 23.3 L119.9 23.7 L124.0 24.2 L127.5 26.1 L130.4 29.8 L133.2 33.8 L136.8 35.8 L141.5 34.6 L146.9 31.4 L151.9 29.3 L155.3 31.7 L157.4 37.7 L159.3 44.1 L162.2 47.7 L166.8 47.0 L172.4 43.3 L177.8 40.0 L182.0 40.2 L184.6 44.7 L186.5 51.3 L188.8 56.7 L192.5 58.1 L197.7 55.6 L203.4 51.6 L208.3 49.8 L211.7 52.2 L213.8 58.2 L215.7 64.7 L218.6 68.3 L223.1 67.5 L228.8 63.8 L234.2 60.5 L238.4 60.7 L241.0 65.2 L242.8 71.9" stroke="#fdf3e6" stroke-opacity="0.65"/>
      </g>
      <g filter="url(#shadow)">
        <rect x="-31" y="-128" width="62" height="48" rx="7" fill="#1a1a1a" stroke="#fdf3e6" stroke-opacity="0.85" stroke-width="2.5"/>
        <path d="M-31 -104H31" stroke="#fdf3e6" stroke-opacity="0.35" stroke-width="1.5"/>
        <rect x="-95" y="22" width="190" height="62" rx="28" fill="url(#edge)" stroke="#fdf3e6" stroke-opacity="0.85" stroke-width="2.5"/>
        <path d="M-51.0 -88.0 L51.0 -88.0 Q75.0 -88.0 77.3 -64.1 L85.7 26.1 Q88.0 50.0 64.0 50.0 L-64.0 50.0 Q-88.0 50.0 -85.7 26.1 L-77.3 -64.1 Q-75.0 -88.0 -51.0 -88.0 Z" fill="url(#shell)" stroke="#fdf3e6" stroke-opacity="0.9" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <rect x="-38" y="58" width="76" height="17" rx="8.5" fill="#050505" stroke="#fdf3e6" stroke-opacity="0.8" stroke-width="2"/>
      <path d="M-74 -58C-50 -40 -22 -32 6 -33C34 -34 56 -50 70 -78" fill="none" stroke="#fdf3e6" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-62 -80H52" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-14" cy="-52" r="6.5" fill="#facc15" filter="url(#glow)"/>
    </g>
  </g>
</svg>
