[package]
name = "bt-w"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "CLI and tray icon for the Creative BT-W5 and BT-W6 Bluetooth audio dongles"
repository = "https://github.com/emaspa/bt-w"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
hidapi = "2.6.7"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
